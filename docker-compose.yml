version: '3.8'
services:
  metadata-remote:
    image: ghcr.io/painkiller-alt/metadata-remote:latest
    container_name: metadata-remote
    ports:
      - "8338:8338"
    volumes:
      - /PATH/TO/YOUR/FILES:/music  # Users must change this
      # To add multiple music folders, mount them as subdirectories:
      # - /path/to/music1:/music/Library1
      # - /path/to/music2:/music/Library2
      # ... etc.
    environment:
      - PUID=1000
      - PGID=1000
      # Uncomment the line below to show hidden files (files starting with .)
      # - SHOW_HIDDEN_FILES=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8338/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
